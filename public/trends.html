<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trends</title>
    <link rel="stylesheet" href="/css/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="/js/trends.js"></script>

</head>
<body>
    <nav>
        <a href="index.html">Dashboard</a>
        <a href="trends.html">Trends</a>
        <a href="lookup.html">Lookup</a>
        <a href="about.html">About</a>
    </nav>

    <div class="trends-layout">

        <aside class="sidebar card">

            <h2>Popular Stocks</h2>

            <button
            class="button-86 stock-button"
            onclick="loadChart('AAPL')">
            AAPL
            </button>

            <button
            class="button-86 stock-button"
            onclick="loadChart('MSFT')">
            MSFT
            </button>

            <button
            class="button-86 stock-button"
            onclick="loadChart('NVDA')">
            NVDA
            </button>

            <button
            class="button-86 stock-button"
            onclick="loadChart('TSLA')">
            TSLA
            </button>

            <button
            class="button-86 stock-button"
            onclick="loadChart('AMZN')">
            AMZN
            </button>

        </aside>

        <main class="trends-main">

            <div class="card">

                <h1>Historical Trends</h1>

                <input
                    id="symbolInput"
                    placeholder="Enter Symbol"
                >

                <button
                    class="button-85"
                    onclick="searchChart()">
                    Load Chart

                </button>

                <div class="chart-container">
                    <canvas id="stockChart"></canvas>
                </div>

            </div>

        </main>

    </div>

</body>
</html>
